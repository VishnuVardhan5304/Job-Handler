name: CI

on:
  push:
    branches: [main, master, Vardhan]
  pull_request:
    branches: [main, master, Vardhan]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and production build
        run: npm run build

  backend:
    name: Backend import check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Placeholder only — CI must never use production Neon credentials
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci_job_handler
      CLIENT_URL: http://localhost:5173
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Byte-compile application package
        run: python -m compileall -q app
      - name: Import FastAPI app
        run: python -c "from app.main import app; print(app.title, len(app.routes))"
